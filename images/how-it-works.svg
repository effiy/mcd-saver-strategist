  <text x="600" y="618" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a09d97">示例数据快照 · 实际价格与券可用性以麦当劳 MCP 实时返回为准 · github.com/hujjun/mcd-saver-strategist</text>
</svg>
