    <rect x="532" y="205" width="190" height="180" rx="14" fill="url(#hero)" stroke="#eae8e4"/>
    <rect x="532" y="205" width="190" height="5" rx="2.5" fill="#2159a8"/>
    <circle cx="564" cy="243" r="13" fill="#eef5ff"/>
