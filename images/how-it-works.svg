    <rect x="60" y="205" width="190" height="180" rx="14" fill="url(#hero)" stroke="#eae8e4"/>
    <rect x="60" y="205" width="190" height="5" rx="2.5" fill="#DA291C"/>
    <circle cx="92" cy="243" r="13" fill="#fdece9"/>
    <text x="92" y="248" text-anchor="middle" font-size="13" font-weight="800" fill="#DA291C">1</text>
    <text x="155" y="248" text-anchor="middle" font-size="16.5" font-weight="750" fill="#141413">用户需求</text>
    <text x="155" y="282" text-anchor="middle" font-size="12.5" fill="#6b6a67">想吃巨无霸 + 薯条 + 可乐</text>
    <text x="155" y="303" text-anchor="middle" font-size="12.5" fill="#6b6a67">预算 / 热量上限 / 到店或外送</text>
    <rect x="98" y="330" width="114" height="26" rx="8" fill="#f6f4f0"/>
    <text x="155" y="347" text-anchor="middle" font-size="11" fill="#8a8880">自然语言 → 结构化</text>

    <!-- 箭头 1 -->
    <path d="M258 295 h30 m-8 -7 l8 7 l-8 7" stroke="#c9c5be" stroke-width="2" fill="none"/>

    <!-- 卡片 2 -->
    <rect x="296" y="205" width="190" height="180" rx="14" fill="url(#hero)" stroke="#eae8e4"/>
    <rect x="296" y="205" width="190" height="5" rx="2.5" fill="#e0a800"/>
    <circle cx="328" cy="243" r="13" fill="#fff7e0"/>
    <text x="328" y="248" text-anchor="middle" font-size="13" font-weight="800" fill="#a37500">2</text>
    <text x="391" y="248" text-anchor="middle" font-size="16.5" font-weight="750" fill="#141413">MCP 取数</text>
    <text x="391" y="282" text-anchor="middle" font-size="12.5" fill="#6b6a67">门店菜单 · 实时价格</text>
