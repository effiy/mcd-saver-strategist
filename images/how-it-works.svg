<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1b19"/>
      <stop offset="1" stop-color="#2b2723"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="675" fill="#faf9f7"/>
  <g opacity="0.5">
    <path d="M0 60 H1200 M0 615 H1200" stroke="#efece7" stroke-width="1"/>
  </g>

  <!-- 标题区 -->
  <text x="60" y="64" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#DA291C">MCD-SAVER-STRATEGIST · 麦门省钱精算师</text>
  <text x="60" y="116" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="800" fill="#141413">省 53% 是怎么算出来的</text>
  <text x="60" y="150" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#6b6a67">确定性组合优化，不靠大模型口算 —— 每一分钱都可复现、可核验</text>

