    <text x="627" y="248" text-anchor="middle" font-size="16.5" font-weight="750" fill="#141413">归一化</text>
    <text x="627" y="282" text-anchor="middle" font-size="12.5" fill="#6b6a67">menu.json / coupons.json</text>
    <text x="627" y="303" text-anchor="middle" font-size="12.5" fill="#6b6a67">request.json</text>
    <rect x="570" y="330" width="114" height="26" rx="8" fill="#f6f4f0"/>
    <text x="627" y="347" text-anchor="middle" font-size="11" fill="#8a8880">数据与逻辑分离</text>

    <!-- 箭头 3 -->
    <path d="M730 295 h30 m-8 -7 l8 7 l-8 7" stroke="#c9c5be" stroke-width="2" fill="none"/>

