    <text x="96" y="530" font-size="15" fill="#b9b6b0">直选（不用券）</text>
    <text x="96" y="556" font-size="26" font-weight="700" fill="#7d7a74" text-decoration="line-through">¥47.00</text>

    <path d="M268 528 h44 m-10 -9 l10 9 l-10 9" stroke="#FFC72C" stroke-width="2.5" fill="none"/>

    <text x="336" y="530" font-size="15" fill="#e8e6e1">精算师最优解</text>
    <text x="336" y="558" font-size="30" font-weight="800" fill="#FFC72C">¥21.90</text>

    <line x1="500" y1="470" x2="500" y2="540" stroke="#3a3733" stroke-width="1"/>

    <text x="532" y="497" font-size="13" fill="#9d9a93">用到的券</text>
    <rect x="532" y="508" width="170" height="28" rx="8" fill="rgba(255,199,44,.12)"/>
    <text x="617" y="527" text-anchor="middle" font-size="12.5" fill="#FFC72C">🎟 1+1 随心配 ¥12.9</text>
    <text x="532" y="556" font-size="12.5" fill="#8f8c86">巨无霸 + 中薯条打包，可乐单点</text>

    <rect x="944" y="482" width="164" height="46" rx="12" fill="#0a8f4d"/>
    <text x="1026" y="502" text-anchor="middle" font-size="13" fill="#d9f3e5">立省</text>
    <text x="1026" y="521" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">¥25.10 · 53%</text>
