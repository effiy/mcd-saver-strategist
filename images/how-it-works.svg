    <rect x="768" y="197" width="190" height="196" rx="14" fill="#ffffff" stroke="#DA291C" stroke-width="2"/>
    <rect x="768" y="197" width="190" height="5" rx="2.5" fill="#DA291C"/>
    <circle cx="800" cy="235" r="13" fill="#fdece9"/>
    <text x="800" y="240" text-anchor="middle" font-size="13" font-weight="800" fill="#DA291C">4</text>
    <text x="863" y="240" text-anchor="middle" font-size="16.5" font-weight="750" fill="#DA291C">确定性优化器</text>
    <text x="863" y="272" text-anchor="middle" font-size="12.5" fill="#6b6a67">5 类券建模 · 穷举 + 剪枝</text>
    <text x="863" y="293" text-anchor="middle" font-size="12.5" fill="#6b6a67">互斥规则保守处理</text>
