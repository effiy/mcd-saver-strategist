    <text x="863" y="339" text-anchor="middle" font-size="11.5" fill="#9d9a93" font-family="Consolas,monospace">optimizer.py</text>
    <text x="863" y="359" text-anchor="middle" font-size="11.5" fill="#FFC72C" font-family="Consolas,monospace">→ Top-N 最优解</text>

